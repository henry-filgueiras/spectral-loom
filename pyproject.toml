[project]
name = "spectral-loom"
version = "0.0.1"
description = "Compile music into a source-grounded semantic timeline, then weave that timeline into synchronized visual projections."
readme = "README.md"
requires-python = "==3.11.*"
license = { file = "LICENSE" }
authors = [{ name = "Henry Filgueiras" }]
keywords = ["music", "audio-analysis", "timeline", "provenance", "visualization"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "pydantic>=2.9,<3",
    # Corpus specifications are authored by hand and are therefore YAML.
    # This is the only reason PyYAML is here; nothing else parses YAML.
    "pyyaml>=6,<7",
]

[project.scripts]
spectral-loom = "spectral_loom.cli:main"

[project.urls]
Repository = "https://github.com/henry-filgueiras/spectral-loom"

# The model cabinet. Optional on purpose: `uv sync` installs none of it, and a
# contributor who only wants to run the tests never downloads a torch wheel.
# See archaeology/decisions/0005 for why it is out of the default environment,
# and `model-cabinet.toml` for what these versions actually mean — the package
# versions here are the *implementation* identity of each cabinet entry, and the
# weights they load are pinned separately because upstream versions them
# separately.
#
# Materialize it into its own environment rather than into `.venv`, so the fast
# feedback loop is not rebuilt every time the cabinet is stocked or unstocked:
#
#   scripts/bootstrap_cabinet.py env
#
# which is `UV_PROJECT_ENVIRONMENT=.venv-cabinet uv sync --extra cabinet` with
# the lockfile enforced.
[project.optional-dependencies]
cabinet = [
    # ACE-Step 1.5 runs through diffusers' own AceStepPipeline. The upstream
    # ACE-Step repository is not a dependency: its Hugging Face checkpoints are
    # `custom_code` and loading them would mean `trust_remote_code`, which
    # scripts/README.md forbids. See archaeology/decisions/0008.
    "diffusers==0.40.0",
    "transformers==5.15.1",
    "torch==2.13.0",
    "accelerate==1.14.0",
    "soundfile==0.14.0",
    # Source separation. Weights are pinned in `model-cabinet.toml`.
    "demucs==4.1.0",
    # Note inference. Ships its own weights inside the distribution, which is
    # why it has no entry under `models/`.
    "basic-pitch==0.4.0",
]

[tool.uv]
# The cabinet does not resolve for every platform, and pretending otherwise
# would produce a lockfile that cannot be written at all. demucs 4.1.0 caps
# torch below 2.3 on Intel macOS, which no other cabinet entry tolerates, so
# `darwin/x86_64` is excluded rather than silently unsatisfiable. Apple silicon
# is the host this project targets and Linux is what CI runs.
# See archaeology/decisions/0009.
environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.8,<1",
    "mypy>=1.13,<2",
    "types-pyyaml>=6,<7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spectral_loom"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
files = ["src", "tests"]
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

# The cabinet is not installed in the environment that type-checks, on purpose:
# `uv sync` stays light, and CI never downloads a torch wheel. These are the
# imports that only exist inside `.venv-cabinet`, and they are confined to the
# function bodies that actually run inference.
[[tool.mypy.overrides]]
module = ["torch.*", "diffusers.*", "soundfile.*", "demucs.*", "basic_pitch.*", "huggingface_hub.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# The default selection is the hermetic unit suite: no network, no model
# weights, no CI step that has to download anything. Both escape markers are
# deselected here rather than merely documented, so `uv run pytest` means the
# same thing on a laptop, in CI, and on a machine with an empty model cabinet.
# See archaeology/decisions/0007.
addopts = "-ra --strict-markers -m 'not needs_model and not needs_network'"
markers = [
    "needs_model: requires model weights on disk; never runs in CI",
    "needs_network: must reach the network; lifts the tests/netguard.py block",
]
